<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PARK PLAN</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#171717;--muted:#727582;--line:#e6e8ee;--accent:#e33d4e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:105px}
header{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}
.share{border:0;background:#111;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800}
main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 10px 26px #18203212;margin-bottom:13px}
.eyebrow{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.1em}.planname{width:100%;border:0;outline:0;font-size:24px;font-weight:900;margin:4px 0 10px;background:transparent}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{border:1px solid var(--line);border-radius:13px;padding:9px 10px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-weight:700}
.next{background:#111;color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}.next small{color:#ffd4da;font-weight:900}.ntime{font-size:34px;font-weight:950;margin-top:4px}.ntitle{font-size:18px;font-weight:900}.nnote{font-size:12px;color:#c8cbd3;margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:9px}.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}
.item.done{opacity:.48}.item.done .ititle{text-decoration:line-through}.time{font-weight:900}.badge{display:inline-block;font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;margin-bottom:3px}
.dpa{background:#ffe3e7;color:#b52434}.pp{background:#e3f7e8;color:#26813b}.sp{background:#fff0db;color:#995a00}.food{background:#f2e8ff;color:#7040a1}.show{background:#e4efff;color:#2861a7}.special{background:#fff6ce;color:#896c00}.other{background:#eceef2;color:#555}
.ititle{font-weight:850}.inote{font-size:12px;color:var(--muted);margin-top:3px}.acts{display:flex;flex-direction:column;gap:6px}.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff}
.empty{background:#fff;border:1px dashed #cfd2da;border-radius:17px;padding:28px;text-align:center;color:var(--muted)}
.addbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fffffff2}
.add{width:100%;border:0;border-radius:17px;padding:16px;background:var(--accent);color:#fff;font-weight:900;font-size:16px}
dialog{width:min(440px,calc(100% - 24px));border:0;border-radius:22px;padding:0}dialog::backdrop{background:#12141a99}.modal{padding:20px}.modal h3{margin:0 0 15px}.grid{display:grid;gap:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrap input,.wrap select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.mactions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}.secondary,.primary{border:0;border-radius:13px;padding:13px;font-weight:800}.secondary{background:#eceef3}.primary{background:#111;color:#fff}
.hint{font-size:11px;color:var(--muted);line-height:1.55;margin:10px 2px}
</style>
</head>
<body>
<div class="app">
<header><div class="row"><h1>🏰 PARK PLAN 🌋</h1><button class="share" id="share">共有</button></div></header>
<main>
<section class="card">
<div class="eyebrow">TODAY'S PLAN</div>
<input class="planname" id="planName" value="みんなのパークプラン">
<div class="meta">
<div class="field"><label>日付</label><input type="date" id="date"></div>
<div class="field"><label>パーク</label><select id="park"><option>東京ディズニーランド</option><option>東京ディズニーシー</option><option>その他</option></select></div>
</div>
</section>
<section class="next"><small>NEXT</small><div class="ntime" id="ntime">--:--</div><div class="ntitle" id="ntitle">予定を追加しよう</div><div class="nnote" id="nnote">次の予定がここに表示されます</div></section>
<div class="head"><h2>今日の予定</h2><div class="count" id="count">0件</div></div>
<div class="list" id="list"></div>
<div class="hint">共有ボタンでは、現在の予定を含んだURLを送れます。今回は「共有時点のコピー」で、リアルタイム共同編集は次の段階です。</div>
</main>
<div class="addbar"><button class="add" id="open">＋ 予定を追加</button></div>
</div>

<dialog id="dlg">
<div class="modal">
<h3 id="modalTitle">予定を追加</h3>
<div class="grid">
<div class="wrap"><label>カテゴリ</label><select id="cat"><option value="dpa">DPA</option><option value="pp">PP</option><option value="sp">SP</option><option value="food">フード</option><option value="show">ショー・パレード</option><option value="special">特別な体験</option><option value="other">その他</option></select></div>
<div class="wrap"><label>予定名</label><input id="title" placeholder="例：美女と野獣"></div>
<div class="twocol"><div class="wrap"><label>開始</label><input type="time" id="start" step="300"></div><div class="wrap"><label>終了（任意）</label><input type="time" id="end" step="300"></div></div>
<div class="wrap"><label>メモ（任意）</label><input id="note" placeholder="場所・待ち合わせなど"></div>
</div>
<div class="mactions"><button class="secondary" id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div>
</div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const state={name:"みんなのパークプラン",date:new Date().toISOString().slice(0,10),park:"東京ディズニーランド",items:[],edit:null};
const labels={dpa:["DPA","dpa"],pp:["PP","pp"],sp:["SP","sp"],food:["フード","food"],show:["ショー・パレード","show"],special:["特別な体験","special"],other:["その他","other"]};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins=t=>{if(!t)return 9999;const[a,b]=t.split(":").map(Number);return a*60+b};
function encode(){return btoa(unescape(encodeURIComponent(JSON.stringify({name:state.name,date:state.date,park:state.park,items:state.items}))))}
function decode(v){try{return JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){return null}}
function persist(){localStorage.setItem("parkPlanShare",JSON.stringify(state))}
function render(){
 state.items.sort((a,b)=>mins(a.start)-mins(b.start));
 const list=$("#list");list.innerHTML="";$("#count").textContent=state.items.length+"件";
 if(!state.items.length)list.innerHTML='<div class="empty">まだ予定がありません。<br>下のボタンから追加してみてね。</div>';
 state.items.forEach(x=>{
  const [lab,cls]=labels[x.cat]||labels.other;
  const el=document.createElement("div");el.className="item"+(x.done?" done":"");
  el.innerHTML=`<div class="time">${x.start}${x.end?`<br><span style="font-size:11px;color:#777">〜${x.end}</span>`:""}</div><div><span class="badge ${cls}">${lab}</span><div class="ititle">${esc(x.title)}</div>${x.note?`<div class="inote">${esc(x.note)}</div>`:""}</div><div class="acts"><button class="icon donebtn">${x.done?"↩":"✓"}</button><button class="icon editbtn">✎</button></div>`;
  el.querySelector(".donebtn").onclick=()=>{x.done=!x.done;sync()};
  el.querySelector(".editbtn").onclick=()=>editItem(x.id);
  list.appendChild(el);
 });
 const n=state.items.find(x=>!x.done);$("#ntime").textContent=n?n.start:"--:--";$("#ntitle").textContent=n?n.title:"予定を追加しよう";$("#nnote").textContent=n?(n.note||"次の予定です"):"次の予定がここに表示されます";
}
function sync(){persist();render()}
function load(){
 const shared=location.hash.startsWith("#plan=")?decode(location.hash.slice(6)):null;
 const local=JSON.parse(localStorage.getItem("parkPlanShare")||"null");
 const d=shared||local;if(d){state.name=d.name||state.name;state.date=d.date||state.date;state.park=d.park||state.park;state.items=Array.isArray(d.items)?d.items:[]}
 $("#planName").value=state.name;$("#date").value=state.date;$("#park").value=state.park;render();
}
$("#planName").oninput=e=>{state.name=e.target.value;persist()};$("#date").onchange=e=>{state.date=e.target.value;persist()};$("#park").onchange=e=>{state.park=e.target.value;persist()};
$("#open").onclick=()=>{state.edit=null;$("#modalTitle").textContent="予定を追加";$("#cat").value="food";$("#title").value="";$("#start").value="";$("#end").value="";$("#note").value="";$("#dlg").showModal()};
$("#cancel").onclick=()=>$("#dlg").close();
function editItem(id){const x=state.items.find(y=>y.id===id);state.edit=id;$("#modalTitle").textContent="予定を編集";$("#cat").value=x.cat;$("#title").value=x.title;$("#start").value=x.start;$("#end").value=x.end||"";$("#note").value=x.note||"";$("#dlg").showModal()}
$("#save").onclick=()=>{const title=$("#title").value.trim(),start=$("#start").value;if(!title||!start){alert("予定名と開始時間を入力してね");return}const obj={id:state.edit||uid(),cat:$("#cat").value,title,start,end:$("#end").value,note:$("#note").value.trim(),done:false};if(state.edit){const i=state.items.findIndex(x=>x.id===state.edit);obj.done=state.items[i].done;state.items[i]=obj}else state.items.push(obj);$("#dlg").close();sync()};
$("#share").onclick=async()=>{state.name=$("#planName").value;state.date=$("#date").value;state.park=$("#park").value;const url=location.href.split("#")[0]+"#plan="+encode();try{if(navigator.share)await navigator.share({title:state.name,text:state.date+" "+state.park+"のプラン",url});else{await navigator.clipboard.writeText(url);alert("共有リンクをコピーしました")}}catch(e){if(e.name!=="AbortError")prompt("このURLをコピーして共有してね",url)}};
load();
</script>
</body>
</html>
